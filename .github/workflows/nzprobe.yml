name: nzprobe
on:
  push:
    branches: [src/nz-hud-home-sales]
    paths: [".github/workflows/nzprobe.yml"]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch and dump
        run: |
          mkdir -p out
          UA="ProofPrice-probe (hello@proofprice.com)"
          curl -sS -L -A "$UA" -o out/about.html "https://www.hud.govt.nz/stats-and-insights/property-and-sales-statistics/about-the-dashboard" || true
          grep -o 'href="[^"]*\.xlsx[^"]*"' out/about.html | head -5 > out/links.txt || true
          cat out/links.txt
          L=$(grep -o 'href="[^"]*Property-and-Sales[^"]*\.xlsx[^"]*"' out/about.html | head -1 | sed 's/href="//;s/"$//;s/&amp;/\&/g')
          case "$L" in http*) U="$L";; /*) U="https://www.hud.govt.nz$L";; *) U="";; esac
          echo "URL=$U"
          curl -sS -L -A "$UA" -o out/data.xlsx "$U" || true
          ls -la out
          pip install openpyxl -q
          python3 - <<'PY' > out/dump.txt
          import openpyxl, collections
          wb = openpyxl.load_workbook('out/data.xlsx', read_only=True)
          ws = wb['Sales']
          rows = list(ws.iter_rows(values_only=True))
          hdr = rows[0]; body = rows[1:]
          print('HDR', hdr, len(body))
          c = collections.Counter((r[0], r[1]) for r in body)
          print('TYPES', c)
          areas = collections.defaultdict(set)
          for r in body: areas[r[1]].add(r[2])
          for k, v in areas.items(): print('AREAS', k, len(v), sorted(v)[:80])
          per = sorted(set(r[3] for r in body if r[0]=='Monthly'))
          print('PERIODS first/last', per[:2], per[-6:])
          for name in ('New Zealand','Auckland','Wellington City','Christchurch City','Queenstown-Lakes District'):
              sel = [r for r in body if r[2]==name and r[0]=='Monthly']
              print('AREA', name, len(sel))
              for r in sel[-8:]: print('  ', r)
          q = [r for r in body if r[0]!='Monthly'][:6]
          print('NONMONTHLY sample', q)
          low = [r for r in body if r[0]=='Monthly' and r[4] is not None and r[4] < 5][:3]
          print('LOWCOUNT sample', low)
          nomed = [r for r in body if r[0]=='Monthly' and r[6] is None and r[4] and r[4]>=5][:3]
          print('NOMED>=5 sample', nomed)
          PY
          mkdir -p probes_nz; cp out/dump.txt out/links.txt probes_nz/; echo "$U" > probes_nz/url.txt
      - name: push
        if: always()
        run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git checkout -B nz-probe-out; git add -f probes_nz; git commit -qm "nz probe dump"; git push -f origin nz-probe-out
