name: nzprobe
on:
  push:
    branches: [src/nz-hud-home-sales]
    paths: [".github/workflows/nzprobe.yml"]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch and dump
        run: |
          mkdir -p out
          UA="ProofPrice-probe (hello@proofprice.com)"
          curl -sS -L -A "$UA" -o out/about.html "https://www.hud.govt.nz/stats-and-insights/property-and-sales-statistics/about-the-dashboard" || true
          grep -o 'href="[^"]*\.xlsx[^"]*"' out/about.html | head -5 > out/links.txt || true
          cat out/links.txt
          L=$(grep -o 'href="[^"]*Property-and-Sales[^"]*\.xlsx[^"]*"' out/about.html | head -1 | sed 's/href="//;s/"$//;s/&amp;/\&/g')
          case "$L" in http*) U="$L";; /*) U="https://www.hud.govt.nz$L";; *) U="";; esac
          echo "URL=$U"
          curl -sS -L -A "$UA" -o out/data.xlsx "$U" || true
          ls -la out
          pip install openpyxl -q
          python3 - <<'PY' > out/dump.txt
          import openpyxl
          wb = openpyxl.load_workbook('out/data.xlsx', read_only=True)
          for ws in wb.worksheets:
              print('SHEET', repr(ws.title), ws.max_row, ws.max_column)
              for i, row in enumerate(ws.iter_rows(values_only=True)):
                  if i >= 14: break
                  row = list(row)
                  while row and row[-1] in (None, ''): row.pop()
                  print(i, row[:24])
          PY
          mkdir -p probes_nz; cp out/dump.txt out/links.txt probes_nz/; echo "$U" > probes_nz/url.txt
      - name: push
        if: always()
        run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git checkout -B nz-probe-out; git add -f probes_nz; git commit -qm "nz probe dump"; git push -f origin nz-probe-out
