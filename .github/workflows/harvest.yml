# The daily collector: "AI builds it once, code collects it forever."
# Every day, for each source with a harvest() function, download the official bulk data once,
# store the day's aggregates in library/, run the tests, and commit. No AI, no keys, no cost.
name: Daily price library harvest

on:
  schedule:
    # GitHub starts scheduled runs late (the 03:17 run began at 10:19 to 10:59 UTC on 12-15 Nov, after the Librarian's 10:40 deploy,
    # so production kept yesterday's library: Gap fixes LIBSTALE). Three chances before 10:40 UTC. The guard step below lets a
    # scheduled run exit at once only when the day's work is really DONE: at least 90% of collected sources were visited today.
    # It counts the effect (library/*/meta.json), never a commit message, so a one-source repair run cannot stand in for the full
    # harvest (20, 22 and 23 Nov 2026: a 05:00 one-source run committed "Library: daily harvest <date>", every scheduled run then
    # skipped, and 212 of 214 sources went more than 30 hours stale). A run cut short by its time budget is finished by the next one.
    - cron: "37 0 * * *" # 00:37 UTC
    - cron: "17 3 * * *" # 03:17 UTC
    - cron: "47 5 * * *" # 05:47 UTC
  workflow_dispatch:
    inputs:
      sources:
        description: "Only these source ids (space-separated). Empty = all."
        required: false
        default: ""
      accept_changes:
        description: "Set to true to accept a real jump or unit change once (skips the data checker). Use with a single source id."
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: harvest
  cancel-in-progress: false

jobs:
  harvest:
    # Only ever collect on main: a run started on another branch must never push that branch to main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 100
      - name: Guard (a scheduled run is skipped only when today's full harvest is already done)
        id: guard
        run: |
          # "true" when at least 90% of collected sources have a visit dated today (UTC) in their meta.json. Any doubt means "false":
          # collecting twice is harmless, not collecting is not.
          done_today=$(python3 -I scripts/library_freshness.py guard --min-percent 90 || echo false)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$done_today" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "Today's harvest is already done: nothing to do."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.guard.outputs.skip != 'true'
      - name: Check the code first
        if: steps.guard.outputs.skip != 'true'
        run: npm test
      - name: Harvest
        if: steps.guard.outputs.skip != 'true'
        env:
          SOURCES: ${{ github.event.inputs.sources }}
          ACCEPT: ${{ github.event.inputs.accept_changes }}
          # Sources are collected a few at a time, never two of one country together (lib/library/harvest-pool.ts), so one run
          # covers the whole library inside its budget. Several bulk files can be in memory at once: give Node room.
          HARVEST_CONCURRENCY: "4"
          NODE_OPTIONS: "--max-old-space-size=6144"
        # One source failing is recorded in its library status (/api/v1/library) and in the summary below, and must not email
        # Simon. The run fails only if the collector crashes, no source produced data (both exit non-zero), or more than 3 sources newly errored (a source that already failed on the previous harvest is a known outage, shown as DOWN).
        run: |
          set -o pipefail
          rc=0
          flag=""; [ "$ACCEPT" = "true" ] && [ -n "$SOURCES" ] && flag="--accept-changes"
          npm run harvest -- $flag $SOURCES 2>&1 | tee harvest.log || rc=$?
          # Second chance in a FRESH process for sources that failed on a network error. On 1 Nov pt-ine-rents and pt-home-prices
          # (INE, UND_ERR_CONNECT_TIMEOUT) and au-bitre-airfares failed in the long daily run, yet both INE sources passed when run alone
          # minutes later (and curl reached INE from the same runner). Full runs only; at most 8 sources; 10 minutes at most.
          # 3 Nov 10:47 UTC: TW MOI (3 sources, 'fetch failed'), br-fuel ('terminated'), gb-ukhpi (HTTP 403) and es-placsp ('no rows') were not
          # matched, so 7 sources counted as new errors and the run failed and emailed Simon; the pattern now covers those messages (and the cap is 12).
          if [ -z "$SOURCES" ]; then
            retry=$(grep -E '^(FAIL|DOWN) ' harvest.log | grep -E 'UND_ERR|timed out|Could not reach|Could not download|fetch failed|terminated|ECONN|ETIMEDOUT|ENOTFOUND|HTTP (403|429|5[0-9][0-9])|returned no rows' | sed -E 's/^(FAIL|DOWN) ([^:]+):.*/\2/' | head -12 | tr '\n' ' ' || true)
            if [ -n "$retry" ]; then
              echo "Retrying in a fresh process: $retry"
              timeout 600 npm run harvest -- $retry 2>&1 | tee harvest-retry.log || true
              for id in $retry; do
                if grep -qE "^(OK|HELD)[[:space:]]+$id:" harvest-retry.log; then sed -i -E "/^(FAIL|DOWN) $id:/d" harvest.log; fi
              done
              grep -E '^(OK|HELD)[[:space:]]' harvest-retry.log >> harvest.log || true
            fi
          fi
          failed=$(grep -c '^FAIL ' harvest.log || true)
          {
            echo "### Harvest: $(grep -c '^OK \|^HELD ' harvest.log || true) ok, $failed new error(s), $(grep -c '^DOWN ' harvest.log || true) known outage(s)"
            echo '```'; grep '^FAIL \|^DOWN \|^HELD ' harvest.log || echo "no source errors"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then echo "::error::Collector crashed or no source produced data (exit $rc)"; exit "$rc"; fi
          if [ "$failed" -gt 3 ]; then echo "::error::$failed sources errored (more than 3 new)"; exit 1; fi
          if [ "$failed" -gt 0 ]; then echo "::warning::$failed source(s) errored; see summary and /api/v1/library"; fi
      - name: Commit the day's library (also when some sources failed, so their errors are recorded)
        if: always() && steps.guard.outputs.skip != 'true'
        env:
          SOURCES: ${{ github.event.inputs.sources }}
        run: |
          git config user.name "proofprice-librarian"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add library
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          # A run for named sources says so, so the history shows at a glance which commits are the day's full harvest.
          if [ -n "$SOURCES" ]; then
            ids=$(printf '%s' "$SOURCES" | tr -c 'A-Za-z0-9_, -' ' ' | tr -s ' ' | cut -c1-120)
            git commit -m "Library: harvest of $ids only, $(date -u +%F)"
          else
            git commit -m "Library: daily harvest $(date -u +%F)"
          fi
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1

      # Tell search engines (IndexNow, no account needed) which pages changed. Must never fail the harvest.
      - name: Ping IndexNow
        if: always() && steps.guard.outputs.skip != 'true'
        continue-on-error: true
        run: npx tsx scripts/indexnow.ts || true
