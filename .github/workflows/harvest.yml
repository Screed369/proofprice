# The daily collector: "AI builds it once, code collects it forever."
# Every day, for each source with a harvest() function, download the official bulk data once,
# store the day's aggregates in library/, run the tests, and commit. No AI, no keys, no cost.
name: Daily price library harvest

on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC every day
  workflow_dispatch:
    inputs:
      sources:
        description: "Only these source ids (space-separated). Empty = all."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: harvest
  cancel-in-progress: false

jobs:
  harvest:
    # Only ever collect on main: a run started on another branch must never push that branch to main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the code first
        run: npm test
      - name: Harvest
        env:
          SOURCES: ${{ github.event.inputs.sources }}
        # One source failing is recorded in its library status (/api/v1/library) and in the summary below, and must not email
        # Simon. The run fails only if the collector crashes, no source produced data (both exit non-zero), or more than 3 sources errored.
        run: |
          set -o pipefail
          rc=0
          npm run harvest -- $SOURCES 2>&1 | tee harvest.log || rc=$?
          failed=$(grep -c '^FAIL ' harvest.log || true)
          {
            echo "### Harvest: $(grep -c '^OK \|^HELD ' harvest.log || true) ok, $failed source(s) with errors"
            echo '```'; grep '^FAIL \|^HELD ' harvest.log || echo "no source errors"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then echo "::error::Collector crashed or no source produced data (exit $rc)"; exit "$rc"; fi
          if [ "$failed" -gt 3 ]; then echo "::error::$failed sources errored (more than 3)"; exit 1; fi
          if [ "$failed" -gt 0 ]; then echo "::warning::$failed source(s) errored; see summary and /api/v1/library"; fi
      - name: Commit the day's library (also when some sources failed, so their errors are recorded)
        if: always()
        run: |
          git config user.name "proofprice-librarian"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add library
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -m "Library: daily harvest $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1

      # Tell search engines (IndexNow, no account needed) which pages changed. Must never fail the harvest.
      - name: Ping IndexNow
        if: always()
        continue-on-error: true
        run: npx tsx scripts/indexnow.ts || true
