name: tmp nz groceries probe
on:
  push:
    branches: [src/nz-stats-grocery-prices]
    paths: ['.github/workflows/tmp-nzgroc.yml']
permissions:
  contents: read
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: fetch
        run: |
          set +e
          U="https://www.stats.govt.nz/assets/Uploads/Selected-price-indexes/Selected-price-indexes-September-2026/Download-data/selected-price-indexes-september-2026.csv"
          curl -sS -L --max-time 120 -A "ProofPrice-verifier/1.0 (+https://proofprice.com; hello@proofprice.com)" -o /tmp/f.csv "$U"
          head -1 /tmp/f.csv
          echo ---ROWS
          grep -E '^"CPIM\.SAP(0100|0101|0102|0103|0106|0107|0108|0109|0110|0111|0112|0114|0115|0116|0117|0118|0120|0121|0123|0125|0126|0127|0128|0129|0130|0131|0132|0134|0137|0138|0139|0140|0147|0148|0149|0152|0160|0161|0167|0168|0176|0177|0178|0181|0184|0186|0187|0189|0190|0195|0197|0201|0203|0204|0205|0207|0211|0215|0216|0224|0226|0228|0229|0231|0232|0233|0235|0240|0245|0258|0259|0264|0265|0268)","(2025\.09|2026\.07|2026\.08|2026\.09)",' /tmp/f.csv | grep ',"Dollars",'
          echo ---END
          echo "periods in file for SAP0127:"; grep -c '^"CPIM.SAP0127"' /tmp/f.csv
          exit 0
