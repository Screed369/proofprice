name: vreg tmp
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: dump
        run: |
          curl -sS -L -A "ProofPrice-verifier/1.0 (+https://proofprice.com; hello@proofprice.com)" -o /tmp/b.xlsx "https://assets.vlaamsenutsregulator.be/2026-10/202610-v-test-data-exclbtw%20v2_0.xlsx"
          python3 scripts/xlsx-dump.py /tmp/b.xlsx 1000000 > /tmp/all.txt
          {
          echo "lines: $(wc -l < /tmp/all.txt)"
          grep -n '^--- SHEET' /tmp/all.txt
          python3 - <<'P'
          import collections
          sheet=None; rows=collections.defaultdict(list)
          for l in open('/tmp/all.txt',encoding='utf-8'):
              l=l.rstrip('\n')
              if l.startswith('--- SHEET:'): sheet=l[10:].strip(); continue
              rows[sheet].append(l.split('|'))
          for s,r in rows.items():
              print('SHEET',s,len(r)); print(' header',r[0][:12], r[0][-1])
              if len(r[0])<9: continue
              ym=collections.Counter((x[0],x[1]) for x in r[1:] if len(x)>8)
              print(' months', list(ym.items())[-6:], 'first',list(ym.items())[:2])
              last=list(ym)[-1]
              c=collections.Counter((x[2],x[3],x[4],x[7],x[8]) for x in r[1:] if len(x)>8 and (x[0],x[1])==last)
              for k,v in sorted(c.items()): print('  ',k,v)
              prods=len(set((x[5],x[6]) for x in r[1:] if len(x)>8 and (x[0],x[1])==last))
              print(' products latest month',prods)
              print(' last row', r[-1][:10], r[-1][-1])
          P
          } > /tmp/sum.txt 2>&1
          git config user.name "proofprice-librarian"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin +refs/heads/probes:refs/remotes/origin/probes; git checkout -q -B probes origin/probes
          git rm -rq --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name probes -exec rm -rf {} +
          mkdir -p probes && cp /tmp/sum.txt probes/vreg-sum.txt && git add probes && git commit -qm "vreg summary" && git push -q origin probes
