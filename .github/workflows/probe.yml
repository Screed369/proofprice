name: Probe a public data URL
on:
  workflow_dispatch:
    inputs:
      url:
        required: false
      name:
        required: false
      bytes:
        required: false
permissions:
  contents: read
jobs:
  x:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: explore
        run: |
          set -u
          UA="ProofPrice-verifier/1.0 (+https://proofprice.com; hello@proofprice.com)"
          curl -sS -L --max-time 120 -A "$UA" -o p.html "https://www.vlaamsenutsregulator.be/cijfers/v-test-data-en-energieprijscurves"
          URL=$(grep -o 'https://assets.vlaamsenutsregulator.be/[^"]*v-test-data-exclbtw[^"]*' p.html | head -1 | sed 's/&amp;/\&/g')
          echo "URL=$URL"
          curl -sS -L --max-time 120 -A "$UA" -o f.xlsx "$URL"
          python3 scripts/vreg-explore.py f.xlsx
