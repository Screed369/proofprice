name: zz vreg explore (throwaway, branch only)
on:
  workflow_dispatch:
jobs:
  x:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: explore
        run: |
          set -u
          curl -sS -L --max-time 120 -A "ProofPrice-verifier/1.0 (+https://proofprice.com; hello@proofprice.com)" -o p.html "https://www.vlaamsenutsregulator.be/cijfers/v-test-data-en-energieprijscurves"
          URL=$(grep -o 'https://assets.vlaamsenutsregulator.be/[^"]*v-test-data-exclbtw[^"]*' p.html | head -1 | sed 's/&amp;/\&/g')
          echo "URL=$URL"
          curl -sS -L --max-time 120 -A "ProofPrice-verifier/1.0 (+https://proofprice.com; hello@proofprice.com)" -o f.xlsx "$URL"
          pip install openpyxl >/dev/null 2>&1
          python3 - <<'P'
          import openpyxl, collections
          wb=openpyxl.load_workbook('f.xlsx',read_only=True)
          print(wb.sheetnames)
          for name in wb.sheetnames:
              if 'vast' not in name.lower() or 'var' in name.lower(): continue
              ws=wb[name]; rows=ws.iter_rows(values_only=True)
              hdr=next(rows); print('SHEET',name,hdr)
              c=collections.Counter(); comp=collections.Counter(); n=0; last=[]
              seg=collections.Counter(); sample=[]
              for r in rows:
                  if r[0] is None: continue
                  n+=1
                  c[(r[0],r[1])]+=1
                  if r[2]=='Woning' and r[3]=='Elektriciteit' and r[4]=='Afname': comp[r[8]]+=1
                  seg[(r[2],r[3],r[4],r[7])]+=1
                  last.append(r)
              print('rows',n); print('periods',sorted(c.items(),key=lambda x:(x[0][0],x[0][1]))[-14:])
              print('segments',seg)
              print('components Woning/El/Afname',comp)
              latest=[r for r in last if (r[0],r[1])==(last[-1][0],last[-1][1])]
              print('last row',last[-1])
              for r in latest:
                  if r[2]=='Woning' and r[3]=='Elektriciteit' and r[4]=='Afname' and r[8] and r[8].startswith('Enkelvoudige meter dag'): sample.append(r)
              print('latest period single-meter day rows',len(sample)); 
              for r in sample[:12]: print(r)
              for r in latest:
                  if r[2]=='Woning' and r[3]=='Gas' and r[4]=='Afname': print('GAS',r); break
              for r in latest:
                  if r[3] and r[3].lower().startswith('gas'): print('GASrow',r); break
              print('distinct energietypen',set(r[3] for r in last), set(r[1] for r in last))
          P
