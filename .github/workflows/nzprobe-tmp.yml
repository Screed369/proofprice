name: nz probe tmp
on:
  push:
    branches: [src/nz-stats-groceries]
permissions:
  contents: read
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: probe
        continue-on-error: true
        run: |
          UA="ProofPrice-verifier/1.0 (+https://proofprice.com; hello@proofprice.com)"
          curl -sS -L --max-time 60 -A "$UA" -o df.xml "https://api.data.stats.govt.nz/rest/dataflow/all/all/latest?detail=allstubs" -w "%{http_code} %{size_download}\n" || true
          echo "=== matching dataflows"
          grep -o '<structure:Dataflow [^>]*>' df.xml | grep -i -E 'id="(CPI|FPI|SPI)' | head -30 || true
          grep -i -E -B1 -A3 'Selected price|Food price|average price' df.xml | grep -E 'Dataflow |common:Name' | head -30 || true
          echo "=== copyright text"
          curl -sS -L --max-time 60 -A "$UA" "https://www.stats.govt.nz/about-us/copyright/" | sed 's/<[^>]*>/ /g' | tr -s ' \n' | grep -i -m8 "creative commons\|licensed\|attribution" || true
          echo "=== csv download page"
          curl -sS -L --max-time 60 -A "$UA" "https://www.stats.govt.nz/information-releases/selected-price-indexes-september-2026/" | sed 's/<[^>]*>/ /g' | tr -s ' \n' | grep -i -m8 "creative commons\|licen\|attribution\|csv" || true
