name: nz probe tmp
on:
  push:
    branches: [src/nz-stats-groceries]
permissions:
  contents: read
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          curl -sS -L --max-time 120 -A "ProofPrice-verifier/1.0 (+https://proofprice.com; hello@proofprice.com)" -o f.csv "https://www.stats.govt.nz/assets/Uploads/Selected-price-indexes/Selected-price-indexes-September-2026/Download-data/selected-price-indexes-september-2026.csv"
          echo "=== Dollar groups"; grep '"Dollars"' f.csv | awk -F'","' '{print $7}' | sort | uniq -c
          echo "=== tails"; for s in SAP0127 SAP0130 SAP0149 SAP0131; do grep "^\"CPIM.$s\"" f.csv | tail -3; grep "^\"CPIM.$s\"" f.csv | head -1; done
          echo "=== SAP series with last period"; grep '^"CPIM.SAP' f.csv | awk -F'","' '{k=$1; last[k]=$2; v[k]=$3; t[k]=$8; n[k]++} END{for(k in last) print k, last[k], v[k], n[k], t[k]}' | sort | head -150
          echo "=== status values"; grep '^"CPIM.SAP' f.csv | awk -F'","' '{print $4}' | sort | uniq -c
          echo "=== other SAP prefixes"; grep -o '^"CPIM\.[A-Z]*' f.csv | sort | uniq -c
