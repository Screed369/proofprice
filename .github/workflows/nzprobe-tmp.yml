name: nz probe tmp
on:
  push:
    branches: [src/nz-stats-groceries]
permissions:
  contents: read
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          UA="ProofPrice-verifier/1.0 (+https://proofprice.com; hello@proofprice.com)"
          curl -sS -L --max-time 60 -A "$UA" -o df.json "https://api.data.stats.govt.nz/rest/dataflow/all/all/latest?detail=allstubs" -w "%{http_code} %{size_download}\n"
          echo "=== dataflow ids with price/food/CPI"; python3 - <<'PY'
          import json,re
          d=json.load(open('df.json'))
          fl=d.get('data',{}).get('dataflows') or d.get('dataflows') or []
          print(len(fl))
          for f in fl:
              n=f.get('name') or ''
              if isinstance(n,dict): n=n.get('en') or str(n)
              if re.search(r'price|food|cpi',n+f.get('id',''),re.I): print(f.get('id'),'|',n)
          PY
          echo "=== copyright"; curl -sS -L --max-time 60 -A "$UA" "https://www.stats.govt.nz/about-us/copyright" -w "\n%{http_code} %{size_download}\n" | sed 's/<[^>]*>/ /g' | tr -s ' \n' | grep -i -m12 "creative commons\|licen\|copyright\|attribution"
