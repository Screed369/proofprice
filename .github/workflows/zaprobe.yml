name: zaprobe
on:
  push:
    branches: [src/za-statssa-groceries]
    paths: [".github/workflows/zaprobe.yml"]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch and dump
        run: |
          mkdir -p out
          curl -sS -A "ProofPrice-probe (hello@proofprice.com)" -o out/all.zip "https://www.statssa.gov.za/timeseriesdata/Excel/P0141%20-%20CPI%20Average%20Prices%20All%20urban%20(202609).zip" || true
          cd out && unzip -o all.zip >/dev/null 2>&1; ls -la
          pip install openpyxl -q
          python3 - <<'PY' > ../zadump.txt
          import glob, openpyxl
          for f in glob.glob('*.xlsx'):
              wb = openpyxl.load_workbook(f, read_only=True)
              print('FILE', f)
              for ws in wb.worksheets:
                  print('SHEET', ws.title)
                  for i, row in enumerate(ws.iter_rows(values_only=True)):
                      row = list(row)
                      while row and row[-1] in (None, ''): row.pop()
                      if not any(c not in (None,'') for c in row): 
                          if i > 3000: break
                          continue
                      if i == 0: print('HDR_LAST', row[-6:], 'ncols', len(row))
                      print(i, row[2], '|', row[4], '|', row[5], '|', row[8], '|', row[9], '|', row[-3:])
                      if i > 3000: break
          PY
          
          cd ..; mkdir -p probes_za; cp zadump.txt probes_za/
      - name: push
        run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git checkout -B za-probe-out; git add -f probes_za; git commit -qm "za probe dump" ; git push -f origin za-probe-out
